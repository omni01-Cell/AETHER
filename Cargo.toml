[workspace]
resolver = "2"
members = [
    "crates/aether-core",
    "crates/aether-cli",
    "crates/aether-daemon",
    "crates/aether-video",
    "crates/aether-audio",
    "crates/aether-image",
    "crates/aether-persistence",
    "crates/aether-generate",
    "crates/aether-project",
    "crates/aether-vault", "crates/aether-planner",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
bincode = "2.0.0-rc.3"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
rustyline = "14.0"
ffmpeg-next = "7.0"
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
rubato = "0.16"
image = "0.25"
resvg = "0.44"
tiny-skia = "0.11"
fontdb = "0.22"
ttf-parser = "0.25"
blake3 = "1.5"
async-trait = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
